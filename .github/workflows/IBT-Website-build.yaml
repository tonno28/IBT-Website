# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: ibt-website-editorial/out

jobs:
# Please do not rename this job
  build-project:
    name: build IBT-Website
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # Die Seite ist ein statischer Next-Export (output: "export"). Der Build
      # legt reines HTML/CSS/JS nach ibt-website-editorial/out, das IONOS
      # unverändert ausliefert.
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ibt-website-editorial/package-lock.json

      - name: install dependencies
        run: npm ci
        working-directory: ibt-website-editorial

      - name: build site
        run: npm run build
        working-directory: ibt-website-editorial
        env:
          NEXT_TELEMETRY_DISABLED: 1

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 78d9a25b-4e52-4ea2-8ee1-3474d7fc6631
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/IBT-Website/config.yaml
          action: upload
